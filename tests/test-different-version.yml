name: Test mockery setup with different version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup-mockery
        name: Setup mockery v2.40.0
        uses: .
        with:
          mockery-version: '2.40.0'
      - name: Assert mockery is in PATH
        run: |
          echo "Checking mockery is available in PATH..."
          if ! command -v mockery &> /dev/null; then
            echo "FAIL: mockery not found in PATH"
            exit 1
          fi
          echo "PASS: mockery found at $(command -v mockery)"
      - name: Assert mockery version is 2.40.0
        run: |
          ACTUAL=$(mockery --version 2>&1 || true)
          echo "actual: $ACTUAL"
          if echo "$ACTUAL" | grep -q "2.40.0"; then
            echo "PASS: mockery version matches 2.40.0"
          else
            echo "FAIL: expected version 2.40.0 in output: $ACTUAL"
            exit 1
          fi
