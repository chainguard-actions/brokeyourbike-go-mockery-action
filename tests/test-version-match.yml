name: Test mockery version matches requested
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup-mockery
        uses: .
        with:
          mockery-version: '2.42.0'
      - name: Assert mockery version matches requested
        run: |
          INSTALLED_VERSION=$(mockery --version 2>&1 | grep -oP 'v?\K[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          echo "installed version: $INSTALLED_VERSION"
          EXPECTED="2.42.0"
          if [ "$INSTALLED_VERSION" != "$EXPECTED" ]; then
            echo "FAIL: expected version '$EXPECTED' but got '$INSTALLED_VERSION'"
            exit 1
          fi
          echo "PASS: mockery version is $INSTALLED_VERSION"
