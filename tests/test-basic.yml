name: Test basic mockery setup
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        name: Setup mockery
        uses: .
        with:
          mockery-version: '2.43.2'
      - name: Assert mockery is on PATH
        run: |
          echo "Checking mockery is available on PATH..."
          if ! command -v mockery >/dev/null 2>&1; then
            echo "FAIL: mockery not found on PATH"
            exit 1
          fi
          echo "PASS: mockery found at $(command -v mockery)"
      - name: Assert mockery runs
        run: |
          echo "Running mockery --version..."
          mockery --version
          if [ $? -ne 0 ]; then
            echo "FAIL: mockery --version exited with non-zero status"
            exit 1
          fi
          echo "PASS: mockery --version succeeded"
