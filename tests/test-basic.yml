name: Test basic mockery setup
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup-mockery
        uses: .
        with:
          mockery-version: '2.43.0'
      - name: Assert mockery is in PATH
        run: |
          echo "Checking mockery is available in PATH..."
          if ! command -v mockery >/dev/null 2>&1; then
            echo "FAIL: mockery not found in PATH"
            exit 1
          fi
          echo "PASS: mockery found at $(command -v mockery)"
      - name: Assert mockery version matches
        run: |
          VERSION_OUTPUT=$(mockery --version 2>&1 || true)
          echo "mockery version output: $VERSION_OUTPUT"
          if echo "$VERSION_OUTPUT" | grep -q "2.43.0"; then
            echo "PASS: version 2.43.0 confirmed"
          else
            echo "FAIL: expected version 2.43.0 in output: $VERSION_OUTPUT"
            exit 1
          fi
