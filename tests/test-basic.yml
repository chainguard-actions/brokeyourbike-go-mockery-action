name: Test basic mockery setup
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          mockery-version: '2.43.0'
      - name: Assert mockery is on PATH
        run: |
          echo "Checking mockery is available on PATH..."
          if ! command -v mockery >/dev/null 2>&1; then
            echo "FAIL: mockery not found on PATH"
            exit 1
          fi
          echo "PASS: mockery found at $(command -v mockery)"
      - name: Assert mockery version matches requested
        run: |
          INSTALLED_VERSION=$(mockery --version 2>&1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          echo "installed version: $INSTALLED_VERSION"
          if [ "$INSTALLED_VERSION" != "2.43.0" ]; then
            echo "FAIL: expected version 2.43.0 but got $INSTALLED_VERSION"
            exit 1
          fi
          echo "PASS: mockery version matches"
