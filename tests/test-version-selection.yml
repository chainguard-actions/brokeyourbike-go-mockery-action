name: Test mockery version selection
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup-mockery
        uses: .
        with:
          mockery-version: '2.40.0'
      - name: Assert mockery is executable
        run: |
          echo "Checking mockery binary is executable..."
          MOCKERY_PATH=$(command -v mockery 2>/dev/null || true)
          echo "mockery path: $MOCKERY_PATH"
          if [ -z "$MOCKERY_PATH" ]; then
            echo "FAIL: mockery not found in PATH"
            exit 1
          fi
          if [ ! -x "$MOCKERY_PATH" ]; then
            echo "FAIL: mockery binary is not executable"
            exit 1
          fi
          echo "PASS: mockery is executable at $MOCKERY_PATH"
      - name: Assert correct version is installed
        run: |
          VERSION_OUTPUT=$(mockery --version 2>&1 || true)
          echo "mockery version output: $VERSION_OUTPUT"
          if echo "$VERSION_OUTPUT" | grep -q "2.40.0"; then
            echo "PASS: version 2.40.0 confirmed"
          else
            echo "FAIL: expected version 2.40.0 in output: $VERSION_OUTPUT"
            exit 1
          fi
