name: Test mockery version selection
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          mockery-version: '2.42.3'
      - name: Assert mockery is on PATH
        run: |
          echo "Checking mockery is available on PATH..."
          if ! command -v mockery > /dev/null 2>&1; then
            echo "FAIL: mockery not found on PATH"
            exit 1
          fi
          echo "PASS: mockery found at $(command -v mockery)"
      - name: Assert mockery version is 2.42.3
        run: |
          ACTUAL=$(mockery --version 2>&1 || true)
          echo "actual: $ACTUAL"
          if echo "$ACTUAL" | grep -q "2.42.3"; then
            echo "PASS: mockery version matches 2.42.3"
          else
            echo "FAIL: expected version 2.42.3 in output: $ACTUAL"
            exit 1
          fi
